services:
  postgres:
    image: postgres:16-alpine
    container_name: resumeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumeforge
      POSTGRES_USER: resumeforge
      POSTGRES_PASSWORD: resumeforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeforge -d resumeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: resumeforge-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://resumeforge:resumeforge@postgres:5432/resumeforge
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
